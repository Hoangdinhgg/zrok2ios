name: Build zrok iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      GOOS: ios
      GOARCH: arm64
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Clone zrok
        run: |
          git clone --depth=1 https://github.com/openziti/zrok.git
          cd zrok
          git submodule update --init --recursive

      - name: Show Environment
        run: |
          go version
          go env
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos -f clang

      - name: Install dependencies
        working-directory: zrok
        run: |
          go mod download
          go mod tidy

      - name: Configure iOS SDK
        run: |
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun --sdk iphoneos -f clang)" >> $GITHUB_ENV
          echo "CXX=$(xcrun --sdk iphoneos -f clang++)" >> $GITHUB_ENV

      - name: Build
        working-directory: zrok
        run: |
          export SDKROOT="$SDKROOT"
          export CC="$CC"
          export CXX="$CXX"

          go build \
            -v \
            -x \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w" \
            -o zrok-ios \
            ./cmd/zrok

      - name: Inspect Binary
        run: |
          file zrok/zrok-ios || true
          otool -hv zrok/zrok-ios || true
          otool -L zrok/zrok-ios || true

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: zrok-ios
          path: zrok/zrok-ios

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ~/Library/Logs
