name: Build zrok2 iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    env:
      GOOS: ios
      GOARCH: arm64
      CGO_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Clone zrok
        run: |
          git clone --depth=1 https://github.com/openziti/zrok.git "$RUNNER_TEMP/zrok"

      - name: Show Environment
        run: |
          go version
          go env
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos -f clang

      - name: Configure SDK
        run: |
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun --sdk iphoneos -f clang)" >> $GITHUB_ENV
          echo "CXX=$(xcrun --sdk iphoneos -f clang++)" >> $GITHUB_ENV

      - name: Download Dependencies
        working-directory: ${{ runner.temp }}/zrok
        run: |
          go mod download
          go mod tidy

      - name: List Packages
        working-directory: ${{ runner.temp }}/zrok
        run: |
          pwd
          go list ./...

      - name: Build
        working-directory: ${{ runner.temp }}/zrok
        run: |
          go build \
            -v \
            -x \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w" \
            -o zrok2-ios \
            ./cmd/zrok2

      - name: Inspect
        if: always()
        working-directory: ${{ runner.temp }}/zrok
        run: |
          file zrok2-ios || true
          otool -hv zrok2-ios || true
          otool -L zrok2-ios || true

      - name: Prepare Artifact
        if: always()
        run: |
          mkdir -p output
          cp "$RUNNER_TEMP/zrok/zrok2-ios" output/ 2>/dev/null || true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrok2-ios
          path: output
